[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "curatune"
version = "0.1.0"
description = "A playlist toolkit for Spotify: a deterministic library, a thin JSON CLI, and a local MCP server."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Gabriel de Giuli" }]
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.urls]
Homepage = "https://github.com/gabriel-dg/curatune"
Repository = "https://github.com/gabriel-dg/curatune"
Documentation = "https://github.com/gabriel-dg/curatune/tree/main/api#readme"
Issues = "https://github.com/gabriel-dg/curatune/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.17"]
# The MCP server (curatune-mcp). Optional: the library and the CLI never import it.
mcp = ["mcp>=2.2,<3"]

[project.scripts]
curatune = "curatune.cli:main"
curatune-mcp = "curatune.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Spotify's official logo, for the attribution on the MCP confirmation page (a trademark of Spotify AB).
"curatune.mcp_server" = ["assets/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# The core checks only (pyflakes, and pycodestyle's errors): real problems, no style rules.
select = ["E4", "E7", "E9", "F"]
