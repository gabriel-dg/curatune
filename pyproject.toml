[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "curatune"
version = "0.1.0"
description = "A playlist toolkit for Spotify: a deterministic library plus a thin JSON CLI."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# The MCP server (curatune-mcp). Optional: the library and the CLI never import it.
mcp = ["mcp>=2.2,<3"]

[project.scripts]
curatune = "curatune.cli:main"
curatune-mcp = "curatune.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
